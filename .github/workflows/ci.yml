name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: Ninja
            sanitizers: OFF

          - os: ubuntu-latest
            generator: Ninja
            sanitizers: ON

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -G "${{ matrix.generator }}"
          -DCMAKE_BUILD_TYPE=Debug
          -DPQL_ENABLE_SANITIZERS=${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check code format
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
          find src test \
            \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -print0 \
            | xargs -0 clang-format --dry-run --Werror